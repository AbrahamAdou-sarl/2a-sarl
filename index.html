<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABRAHAM ADOU SARL (2A SARL) - Site Officiel</title>
  
  <style>
    /* =========================================================
       STYLES GÉNÉRAUX & VARIABLES
       ========================================================= */
    :root {
      --primary-color: #0d253f;
      --accent-color: #d4af37;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 15px 35px rgba(13, 37, 63, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-dark);
      background-color: #ffffff;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .badge {
      background-color: rgba(212, 175, 55, 0.15);
      color: #967818;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 12px;
    }

    /* =========================================================
       SECTION : À PROPOS & CONFORMITÉ LÉGALE
       ========================================================= */
    .about-section {
      padding: 80px 0;
      background-color: #ffffff;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 50px;
      align-items: center;
    }

    .about-content h2 {
      color: var(--primary-color);
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    .about-content .lead {
      font-size: 1.1rem;
      color: #334155;
      font-weight: 500;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .about-content p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .highlights {
      display: flex;
      gap: 40px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .highlight-item {
      display: flex;
      flex-direction: column;
    }

    .highlight-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-color);
    }

    .highlight-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legal-card {
      background: var(--bg-light);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
    }

    .legal-card h3 {
      color: var(--primary-color);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .legal-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .legal-list {
      list-style: none;
      padding: 0;
      margin: 0 0 25px 0;
    }

    .legal-list li {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 0.95rem;
    }

    .legal-list li:last-child {
      border-bottom: none;
    }

    .legal-list .label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .legal-list .value {
      color: #0f172a;
      font-weight: 700;
      text-align: right;
    }

    .legal-list .value a {
      color: var(--primary-color);
      text-decoration: underline;
    }

    .highlight-text {
      color: var(--accent-color) !important;
    }

    .trust-badge {
      background: rgba(13, 37, 63, 0.05);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary-color);
      font-weight: 600;
    }

    /* =========================================================
       SECTION : MOT DU GÉRANT
       =============
